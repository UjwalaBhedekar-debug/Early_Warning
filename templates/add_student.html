{% extends "base.html" %}

{% block title %}
StudentCare | Add Student
{% endblock %}


{% block content %}

<div class="page-container">

    <h1>
        Add Student
    </h1>

    <p class="page-description">
        Enter student information and academic performance
        to generate an early risk assessment.
    </p>


    <form method="POST"
          action="{{ url_for('add_student') }}"
          class="form-card">


        <!-- =================================================
             STUDENT INFORMATION
             ================================================= -->

        <div class="form-section">

            <div class="form-section-title">
                👨‍🎓
                Student Information
            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Student ID
                    </label>

                    <input
                        type="text"
                        name="student_id"
                        placeholder="Enter student ID"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="student_name"
                        placeholder="Enter student name"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Class / Grade
                    </label>

                    <select name="class_name"
                            required>

                        <option value="">
                            Select class
                        </option>

                        {% for grade in range(1, 13) %}

                        <option value="{{ grade }}">
                            Grade {{ grade }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Attendance (%)
                    </label>

                    <input
                        type="number"
                        name="attendance"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Example: 85"
                        required>

                </div>

            </div>

        </div>



        <!-- =================================================
             ACADEMIC INFORMATION
             ================================================= -->

        <div class="form-section">

            <div class="form-section-title">
                📚
                Academic Information
            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Internal Marks (%)
                    </label>

                    <input
                        type="number"
                        name="internal_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Example: 72"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Assignment Submission
                    </label>

                    <select name="assignment_status"
                            required>

                        <option value="">
                            Select status
                        </option>

                        <option value="On Time">
                            On Time
                        </option>

                        <option value="Late">
                            Late
                        </option>

                        <option value="Not Submitted">
                            Not Submitted
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Previous Performance (%)
                    </label>

                    <input
                        type="number"
                        name="previous_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Example: 68"
                        required>

                </div>

            </div>

        </div>



        <!-- =================================================
             SUBJECT PERFORMANCE
             ================================================= -->

        <div class="form-section">

            <div class="form-section-title">
                📖
                Subject Performance
            </div>


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        English Marks
                    </label>

                    <input
                        type="number"
                        name="english_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Maths Marks
                    </label>

                    <input
                        type="number"
                        name="maths_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Hindi Marks
                    </label>

                    <input
                        type="number"
                        name="hindi_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Marathi Marks
                    </label>

                    <input
                        type="number"
                        name="marathi_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Science Marks
                    </label>

                    <input
                        type="number"
                        name="science_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        History Marks
                    </label>

                    <input
                        type="number"
                        name="history_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Geography Marks
                    </label>

                    <input
                        type="number"
                        name="geography_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        required>

                </div>


            </div>

        </div>



        <!-- =================================================
             SUBMIT
             ================================================= -->

        <div class="form-submit">

            <button type="submit"
                    class="primary-btn">

                Analyse Student
                →
                
            </button>

        </div>


    </form>

</div>

{% endblock %}
